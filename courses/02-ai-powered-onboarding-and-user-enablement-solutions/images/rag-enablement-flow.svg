<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 280" width="1220" height="280" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <!-- 1 User Query -->
  <g filter="url(#shadow)">
    <rect x="12" y="40" width="200" height="200" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="112" cy="100" r="28" fill="#e8f0fe"/>
    <text x="112" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#1a73e8">?</text>
    <text x="112" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">User Query</text>
  </g>

  <line x1="220" y1="140" x2="244" y2="140" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2 Sources -->
  <g filter="url(#shadow)">
    <rect x="252" y="40" width="200" height="200" rx="14" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <circle cx="352" cy="92" r="24" fill="#e6f4ea"/>
    <rect x="340" y="80" width="24" height="28" rx="2" fill="none" stroke="#34a853" stroke-width="2.5"/>
    <path d="M346,88 h12 M346,96 h8" stroke="#34a853" stroke-width="2"/>
    <text x="352" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Approved Source</text>
    <text x="352" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Documents</text>
    <line x1="280" y1="190" x2="424" y2="190" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="352" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#34a853">Knowledge Base</text>
  </g>

  <line x1="460" y1="140" x2="484" y2="140" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3 Retrieval -->
  <g filter="url(#shadow)">
    <rect x="492" y="40" width="200" height="200" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="592" cy="100" r="28" fill="#e8f0fe"/>
    <circle cx="586" cy="96" r="12" fill="none" stroke="#1a73e8" stroke-width="3"/>
    <line x1="595" y1="105" x2="608" y2="118" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <text x="592" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Retrieval</text>
    <text x="592" y="198" text-anchor="middle" font-size="14" fill="#4a5568">Relevant passages</text>
  </g>

  <line x1="700" y1="140" x2="724" y2="140" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 4 Generation -->
  <g filter="url(#shadow)">
    <rect x="732" y="40" width="210" height="200" rx="14" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <circle cx="837" cy="100" r="28" fill="#e6f4ea"/>
    <text x="837" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#34a853">AI</text>
    <text x="837" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">AI Response</text>
    <text x="837" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Generation</text>
    <text x="837" y="214" text-anchor="middle" font-size="13" fill="#4a5568">LLM uses query and context</text>
  </g>

  <line x1="950" y1="140" x2="974" y2="140" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 5 Answer -->
  <g filter="url(#shadow)">
    <rect x="982" y="40" width="226" height="200" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="1095" cy="100" r="28" fill="#e8f0fe"/>
    <circle cx="1095" cy="100" r="14" fill="none" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M1088,100 l5,5 l10,-12" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <text x="1095" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Accurate Answer</text>
    <text x="1095" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">with Citations</text>
  </g>
</svg>
