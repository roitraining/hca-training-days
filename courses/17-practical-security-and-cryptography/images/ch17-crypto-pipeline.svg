<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2332" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e4eaf2"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <line x1="306" y1="250" x2="330" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="594" y1="250" x2="618" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="882" y1="250" x2="906" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="36" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M36,76 Q36,56 56,56 H280 Q300,56 300,76 V126 H36 Z" fill="#1a73e8"/>
    <text x="168" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1. Asymmetric</text>
    <circle cx="168" cy="190" r="36" fill="#e8f0fe"/>
    <circle cx="156" cy="186" r="10" fill="none" stroke="#1a73e8" stroke-width="3"/>
    <path d="M164,192 L186,210" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M178,204 L186,198 M178,214 L188,212" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="180" cy="178" r="8" fill="none" stroke="#34a853" stroke-width="2.5"/>
    <text x="168" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Exchange a session key</text>
    <text x="168" y="302" text-anchor="middle" font-size="14" fill="#5a6a7a">Public/private key pair</text>
    <text x="168" y="324" text-anchor="middle" font-size="14" fill="#5a6a7a">Solves key distribution</text>
    <text x="168" y="346" text-anchor="middle" font-size="14" fill="#5a6a7a">Slower—use sparingly</text>
    <rect x="66" y="400" width="204" height="36" rx="10" fill="#e8f0fe"/>
    <text x="168" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">Key Exchange</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="324" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <path d="M324,76 Q324,56 344,56 H568 Q588,56 588,76 V126 H324 Z" fill="#34a853"/>
    <text x="456" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2. Symmetric</text>
    <circle cx="456" cy="190" r="36" fill="#e6f4ea"/>
    <rect x="442" y="186" width="28" height="22" rx="4" fill="#34a853"/>
    <path d="M448,186 V176 a8,8 0 0 1 16,0 v10" fill="none" stroke="#34a853" stroke-width="3"/>
    <circle cx="456" cy="196" r="3" fill="#ffffff"/>
    <text x="456" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Encrypt the bulk data</text>
    <text x="456" y="302" text-anchor="middle" font-size="14" fill="#5a6a7a">Shared secret (e.g. AES)</text>
    <text x="456" y="324" text-anchor="middle" font-size="14" fill="#5a6a7a">Fast for large payloads</text>
    <text x="456" y="346" text-anchor="middle" font-size="14" fill="#5a6a7a">Uses the exchanged key</text>
    <rect x="354" y="400" width="204" height="36" rx="10" fill="#e6f4ea"/>
    <text x="456" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#34a853">Data Protection</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="612" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#f9ab00" stroke-width="2.5"/>
    <path d="M612,76 Q612,56 632,56 H856 Q876,56 876,76 V126 H612 Z" fill="#f9ab00"/>
    <text x="744" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3. Hashing</text>
    <circle cx="744" cy="190" r="36" fill="#fef7e0"/>
    <rect x="726" y="172" width="36" height="36" rx="6" fill="none" stroke="#e37400" stroke-width="2.5"/>
    <path d="M734,182 h20 M734,190 h14 M734,198 h18" stroke="#e37400" stroke-width="2.5" stroke-linecap="round"/>
    <text x="744" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Verify integrity</text>
    <text x="744" y="302" text-anchor="middle" font-size="14" fill="#5a6a7a">One-way fingerprint</text>
    <text x="744" y="324" text-anchor="middle" font-size="14" fill="#5a6a7a">Detects any change</text>
    <text x="744" y="346" text-anchor="middle" font-size="14" fill="#5a6a7a">Not reversible secrecy</text>
    <rect x="642" y="400" width="204" height="36" rx="10" fill="#fef7e0"/>
    <text x="744" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#e37400">Integrity Check</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="900" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <path d="M900,76 Q900,56 920,56 H1144 Q1164,56 1164,76 V126 H900 Z" fill="#ea4335"/>
    <text x="1032" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4. Together</text>
    <circle cx="1032" cy="190" r="36" fill="#fce8e6"/>
    <path d="M1032,168 L1054,178 V196 c0,14 -10,24 -22,28 c-12,-4 -22,-14 -22,-28 V178 Z" fill="#ea4335"/>
    <path d="M1022,192 L1029,199 L1044,182" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1032" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Secure channel</text>
    <text x="1032" y="302" text-anchor="middle" font-size="14" fill="#5a6a7a">TLS, SSH, and VPN</text>
    <text x="1032" y="324" text-anchor="middle" font-size="14" fill="#5a6a7a">combine all three</text>
    <text x="1032" y="346" text-anchor="middle" font-size="14" fill="#5a6a7a">in real protocols</text>
    <rect x="930" y="400" width="204" height="36" rx="10" fill="#fce8e6"/>
    <text x="1032" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">In Practice</text>
  </g>
</svg>
