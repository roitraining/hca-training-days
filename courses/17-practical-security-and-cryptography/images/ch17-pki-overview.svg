<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2332" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e4eaf2"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <line x1="306" y1="250" x2="330" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="594" y1="250" x2="618" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="882" y1="250" x2="906" y2="250" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M36,76 Q36,56 56,56 H280 Q300,56 300,76 V126 H36 Z" fill="#1a73e8"/>
    <text x="168" y="100" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1. Root CA</text>
    <circle cx="168" cy="180" r="34" fill="#e8f0fe"/>
    <path d="M168,158 L188,168 V184 c0,12 -8,20 -20,24 c-12,-4 -20,-12 -20,-24 V168 Z" fill="#1a73e8"/>
    <text x="168" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CA</text>
    <text x="168" y="252" text-anchor="middle" font-size="15" fill="#1a2332">• Highly secure root key</text>
    <text x="168" y="282" text-anchor="middle" font-size="15" fill="#1a2332">• Self-signed certificate</text>
    <text x="168" y="312" text-anchor="middle" font-size="15" fill="#1a2332">• Stored in OS trust store</text>
    <rect x="66" y="400" width="204" height="36" rx="10" fill="#e8f0fe"/>
    <text x="168" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">Anchor of Trust</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="324" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <path d="M324,76 Q324,56 344,56 H568 Q588,56 588,76 V126 H324 Z" fill="#34a853"/>
    <text x="456" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2. Intermediate CA</text>
    <circle cx="456" cy="180" r="34" fill="#e6f4ea"/>
    <path d="M456,158 L476,168 V184 c0,12 -8,20 -20,24 c-12,-4 -20,-12 -20,-24 V168 Z" fill="#34a853"/>
    <text x="456" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">INT</text>
    <text x="456" y="252" text-anchor="middle" font-size="15" fill="#1a2332">• Signed by Root CA</text>
    <text x="456" y="282" text-anchor="middle" font-size="15" fill="#1a2332">• Issues leaf certificates</text>
    <text x="456" y="312" text-anchor="middle" font-size="15" fill="#1a2332">• Keeps root key offline</text>
    <rect x="354" y="400" width="204" height="36" rx="10" fill="#e6f4ea"/>
    <text x="456" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#34a853">Issuing Authority</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="612" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#f9ab00" stroke-width="2.5"/>
    <path d="M612,76 Q612,56 632,56 H856 Q876,56 876,76 V126 H612 Z" fill="#f9ab00"/>
    <text x="744" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3. Leaf Certificate</text>
    <circle cx="744" cy="180" r="34" fill="#fef7e0"/>
    <rect x="726" y="162" width="36" height="36" rx="5" fill="#e37400"/>
    <path d="M734,174 h20 M734,182 h14 M734,190 h18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="744" y="252" text-anchor="middle" font-size="15" fill="#1a2332">• Binds a domain name</text>
    <text x="744" y="282" text-anchor="middle" font-size="15" fill="#1a2332">• Holds server public key</text>
    <text x="744" y="312" text-anchor="middle" font-size="15" fill="#1a2332">• Expiration and SANs</text>
    <rect x="642" y="400" width="204" height="36" rx="10" fill="#fef7e0"/>
    <text x="744" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#e37400">Server Identity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="56" width="264" height="408" rx="20" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <path d="M900,76 Q900,56 920,56 H1144 Q1164,56 1164,76 V126 H900 Z" fill="#ea4335"/>
    <text x="1032" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4. Client Check</text>
    <circle cx="1032" cy="180" r="34" fill="#fce8e6"/>
    <circle cx="1032" cy="180" r="16" fill="none" stroke="#ea4335" stroke-width="3"/>
    <path d="M1024,180 L1030,186 L1042,172" fill="none" stroke="#ea4335" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1032" y="252" text-anchor="middle" font-size="15" fill="#1a2332">• Validates chain to Root</text>
    <text x="1032" y="282" text-anchor="middle" font-size="15" fill="#1a2332">• Checks CRL / OCSP</text>
    <text x="1032" y="312" text-anchor="middle" font-size="15" fill="#1a2332">• Starts TLS session</text>
    <rect x="930" y="400" width="204" height="36" rx="10" fill="#fce8e6"/>
    <text x="1032" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">Trust Confirmed</text>
  </g>
</svg>
