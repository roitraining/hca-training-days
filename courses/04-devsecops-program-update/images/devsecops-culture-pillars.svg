    <circle cx="206" cy="80" r="6" fill="#1a73e8"/>
    <text x="187" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#1a2332">Shared Ownership</text>
    <text x="187" y="250" text-anchor="middle" font-size="22" fill="#4a5568">Security is a team sport</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="12" width="350" height="336" rx="16" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <circle cx="591" cy="100" r="42" fill="#e6f4ea"/>
    <circle cx="580" cy="100" r="15" fill="none" stroke="#34a853" stroke-width="3.5"/>
    <circle cx="580" cy="100" r="5" fill="#34a853"/>
    <path d="M580,78 v-5 M580,127 v5 M559,100 h-5 M601,100 h5" stroke="#34a853" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M606,88 l16,-5 v16 c0,12 -9,21 -16,24 c-7,-3 -16,-12 -16,-24 v-16 z" fill="none" stroke="#34a853" stroke-width="3"/>
    <text x="591" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#1a2332">Automation First</text>
    <text x="591" y="250" text-anchor="middle" font-size="22" fill="#4a5568">Guardrails over gatekeeping</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="12" width="350" height="336" rx="16" fill="#ffffff" stroke="#e37400" stroke-width="2.5"/>
    <circle cx="995" cy="100" r="42" fill="#fef7e0"/>
    <path d="M974,100 c0,-12 10,-20 21,-12 c11,-8 21,0 21,12 c0,12 -10,20 -21,12 c-11,8 -21,0 -21,-12 z" fill="none" stroke="#e37400" stroke-width="3.5"/>
    <text x="995" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#1a2332">Fast Feedback</text>
    <text x="995" y="250" text-anchor="middle" font-size="22" fill="#4a5568">Fix in the same sprint</text>
