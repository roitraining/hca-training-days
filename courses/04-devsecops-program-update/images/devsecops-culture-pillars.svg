<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <line x1="372" y1="180" x2="402" y2="180" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="776" y1="180" x2="806" y2="180" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="12" y="12" width="350" height="336" rx="16" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="187" cy="100" r="42" fill="#e8f0fe"/>
