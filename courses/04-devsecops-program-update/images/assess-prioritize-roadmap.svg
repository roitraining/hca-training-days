  </defs>

  <line x1="372" y1="180" x2="402" y2="180" stroke="#6b7c8f" stroke-width="3.5" marker-end="url(#arr)"/>
  <line x1="776" y1="180" x2="806" y2="180" stroke="#6b7c8f" stroke-width="3.5" marker-end="url(#arr)"/>

