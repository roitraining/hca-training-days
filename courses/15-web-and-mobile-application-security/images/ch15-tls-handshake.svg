<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 440" width="1220" height="440" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card 1: Client Hello (Blue) -->
  <g filter="url(#shadow)">
    <rect x="14" y="16" width="280" height="408" rx="16" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M30,16 h248 a16,16 0 0 1 16,16 v56 h-280 v-56 a16,16 0 0 1 16,-16 z" fill="#1a73e8"/>
    <text x="154" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1. Client Hello</text>

    <circle cx="38" cy="132" r="5" fill="#1a73e8"/>
    <text x="52" y="138" font-size="18" font-weight="600" fill="#1e293b">Supported versions</text>
    <text x="52" y="162" font-size="17" fill="#475569">(TLS 1.3)</text>

    <circle cx="38" cy="204" r="5" fill="#1a73e8"/>
    <text x="52" y="210" font-size="18" font-weight="600" fill="#1e293b">Supported AEAD</text>
    <text x="52" y="234" font-size="17" fill="#475569">cipher suites</text>

    <circle cx="38" cy="276" r="5" fill="#1a73e8"/>
    <text x="52" y="282" font-size="18" font-weight="600" fill="#1e293b">Client ECDHE</text>
    <text x="52" y="306" font-size="17" fill="#475569">Key Share</text>

    <rect x="30" y="352" width="248" height="52" rx="10" fill="#e8f0fe"/>
    <text x="154" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#1a73e8">Initiates TLS 1.3 Session</text>
  </g>

  <!-- Card 2: Server Hello and Key Agreement (Green) -->
  <g filter="url(#shadow)">
    <rect x="318" y="16" width="280" height="408" rx="16" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <path d="M334,16 h248 a16,16 0 0 1 16,16 v56 h-280 v-56 a16,16 0 0 1 16,-16 z" fill="#34a853"/>
    <text x="458" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2. Server Hello and</text>
    <text x="458" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Key Agreement</text>

    <circle cx="342" cy="132" r="5" fill="#34a853"/>
    <text x="356" y="138" font-size="18" font-weight="600" fill="#1e293b">Selects cipher suite</text>

    <circle cx="342" cy="196" r="5" fill="#34a853"/>
    <text x="356" y="202" font-size="18" font-weight="600" fill="#1e293b">Sends Server</text>
    <text x="356" y="226" font-size="17" fill="#475569">ECDHE Key Share</text>

    <circle cx="342" cy="272" r="5" fill="#34a853"/>
    <text x="356" y="278" font-size="18" font-weight="600" fill="#1e293b">Both sides derive</text>
    <text x="356" y="302" font-size="17" fill="#475569">Handshake Keys</text>

    <rect x="334" y="352" width="248" height="52" rx="10" fill="#e6f4ea"/>
    <text x="458" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#1e8e3e">Derives Handshake Keys</text>
  </g>

  <!-- Card 3: Encrypted Authentication (Gold/Orange) -->
  <g filter="url(#shadow)">
    <rect x="622" y="16" width="280" height="408" rx="16" fill="#ffffff" stroke="#e37400" stroke-width="2.5"/>
    <path d="M638,16 h248 a16,16 0 0 1 16,16 v56 h-280 v-56 a16,16 0 0 1 16,-16 z" fill="#e37400"/>
    <text x="762" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3. Encrypted</text>
    <text x="762" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Authentication</text>

    <circle cx="646" cy="132" r="5" fill="#e37400"/>
    <text x="660" y="138" font-size="18" font-weight="600" fill="#1e293b">Server sends encrypted</text>
    <text x="660" y="162" font-size="17" fill="#475569">Certificate</text>

    <circle cx="646" cy="204" r="5" fill="#e37400"/>
    <text x="660" y="210" font-size="18" font-weight="600" fill="#1e293b">CertificateVerify</text>
    <text x="660" y="234" font-size="17" fill="#475569">(digital signature)</text>

    <circle cx="646" cy="276" r="5" fill="#e37400"/>
    <text x="660" y="282" font-size="18" font-weight="600" fill="#1e293b">Finished MAC</text>
    <text x="660" y="306" font-size="17" fill="#475569">integrity check</text>

    <rect x="638" y="352" width="248" height="52" rx="10" fill="#fef7e0"/>
    <text x="762" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#b06000">Authenticates Server</text>
  </g>

  <!-- Card 4: Application Data (Red) -->
  <g filter="url(#shadow)">
    <rect x="926" y="16" width="280" height="408" rx="16" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <path d="M942,16 h248 a16,16 0 0 1 16,16 v56 h-280 v-56 a16,16 0 0 1 16,-16 z" fill="#ea4335"/>
    <text x="1066" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4. Application Data</text>

    <circle cx="950" cy="132" r="5" fill="#ea4335"/>
    <text x="964" y="138" font-size="18" font-weight="600" fill="#1e293b">Derive Application</text>
    <text x="964" y="162" font-size="17" fill="#475569">Traffic Keys</text>

    <circle cx="950" cy="204" r="5" fill="#ea4335"/>
    <text x="964" y="210" font-size="18" font-weight="600" fill="#1e293b">AES-GCM / ChaCha20</text>
    <text x="964" y="234" font-size="17" fill="#475569">authenticated encryption</text>

    <circle cx="950" cy="276" r="5" fill="#ea4335"/>
    <text x="964" y="282" font-size="18" font-weight="600" fill="#1e293b">Bidirectional HTTP</text>
    <text x="964" y="306" font-size="17" fill="#475569">begins (1-RTT)</text>

    <rect x="942" y="352" width="248" height="52" rx="10" fill="#fce8e6"/>
    <text x="1066" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#c5221f">1-RTT Encrypted Tunnel</text>
  </g>
</svg>
