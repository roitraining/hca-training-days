<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#f4f7fb"/>

  <rect x="40" y="150" width="250" height="520" rx="22" fill="#ffffff" stroke="#003865" stroke-width="3"/>
  <text x="165" y="200" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Sources</text>
  <rect x="70" y="240" width="190" height="90" rx="14" fill="#e8f1f8"/>
  <text x="165" y="292" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">EHR / apps</text>
  <rect x="70" y="360" width="190" height="90" rx="14" fill="#e8f1f8"/>
  <text x="165" y="412" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">Devices</text>
  <rect x="70" y="480" width="190" height="90" rx="14" fill="#e8f1f8"/>
  <text x="165" y="532" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">Other systems</text>

  <line x1="290" y1="410" x2="350" y2="410" stroke="#003865" stroke-width="6"/>
  <polygon points="360,410 336,398 336,422" fill="#003865"/>

  <rect x="370" y="230" width="280" height="360" rx="22" fill="#ffffff" stroke="#1d6fad" stroke-width="3"/>
  <text x="510" y="280" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Get it onto Kafka</text>
  <rect x="400" y="320" width="220" height="100" rx="14" fill="#d6e6f2"/>
  <text x="510" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">App producer</text>
  <text x="510" y="396" text-anchor="middle" font-size="16" fill="#4a5b6b">Your service emits</text>
  <rect x="400" y="450" width="220" height="100" rx="14" fill="#d6e6f2"/>
  <text x="510" y="496" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">Connector</text>
  <text x="510" y="526" text-anchor="middle" font-size="16" fill="#4a5b6b">Connect writes the topic</text>

  <line x1="650" y1="410" x2="720" y2="410" stroke="#003865" stroke-width="6"/>
  <polygon points="730,410 706,398 706,422" fill="#003865"/>

  <rect x="740" y="170" width="360" height="480" rx="22" fill="#003865"/>
  <text x="920" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Confluent Cloud</text>
  <text x="920" y="268" text-anchor="middle" font-size="18" fill="#d6e6f2">Topic: an append-only log</text>
  <rect x="780" y="310" width="280" height="70" rx="12" fill="#1d6fad"/>
  <text x="920" y="352" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Partition 0</text>
  <rect x="780" y="400" width="280" height="70" rx="12" fill="#1d6fad"/>
  <text x="920" y="442" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Partition 1</text>
  <rect x="780" y="490" width="280" height="70" rx="12" fill="#1d6fad"/>
  <text x="920" y="532" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Partition 2</text>

  <line x1="1100" y1="340" x2="1180" y2="250" stroke="#0e7c66" stroke-width="6"/>
  <polygon points="1190,236 1164,246 1176,270" fill="#0e7c66"/>
  <line x1="1100" y1="480" x2="1180" y2="570" stroke="#8a5a00" stroke-width="6"/>
  <polygon points="1190,584 1164,574 1176,550" fill="#8a5a00"/>

  <rect x="1200" y="120" width="360" height="230" rx="22" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1380" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#0c6b52">Consumer group A</text>
  <text x="1380" y="220" text-anchor="middle" font-size="20" fill="#24584a">Operational application</text>
  <text x="1380" y="268" text-anchor="middle" font-size="18" fill="#4a5b6b">Reads the full topic</text>
  <text x="1380" y="302" text-anchor="middle" font-size="18" fill="#4a5b6b">Keeps its own offsets</text>

  <rect x="1200" y="500" width="360" height="230" rx="22" fill="#ffffff" stroke="#c4922a" stroke-width="3"/>
  <text x="1380" y="555" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a5a00">Consumer group B</text>
  <text x="1380" y="600" text-anchor="middle" font-size="20" fill="#5c4a32">Warehouse sink</text>
  <text x="1380" y="648" text-anchor="middle" font-size="18" fill="#4a5b6b">Reads the full topic</text>
  <text x="1380" y="682" text-anchor="middle" font-size="18" fill="#4a5b6b">Keeps its own offsets</text>

  <text x="800" y="820" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Reading an event does not remove it. Each group keeps its own place in the log.</text>
</svg>
