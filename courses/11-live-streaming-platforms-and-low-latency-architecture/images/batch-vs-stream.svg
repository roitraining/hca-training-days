<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect x="36" y="36" width="740" height="828" rx="28" fill="#fff8ee" stroke="#e2c48a" stroke-width="3"/>
  <rect x="824" y="36" width="740" height="828" rx="28" fill="#eef8f5" stroke="#8fcfb8" stroke-width="3"/>

  <text x="406" y="110" text-anchor="middle" font-size="36" font-weight="bold" fill="#8a5a00">Batch</text>
  <text x="406" y="158" text-anchor="middle" font-size="22" fill="#5c4a32">A bounded set, run on a schedule</text>

  <rect x="170" y="210" width="470" height="110" rx="18" fill="#ffffff" stroke="#c4922a" stroke-width="3"/>
  <text x="405" y="258" text-anchor="middle" font-size="26" font-weight="bold" fill="#003865">Collect records</text>
  <text x="405" y="294" text-anchor="middle" font-size="20" fill="#4a5b6b">Files, extracts, closed periods</text>

  <polygon points="405,340 390,370 420,370" fill="#c4922a"/>
  <line x1="405" y1="320" x2="405" y2="360" stroke="#c4922a" stroke-width="6"/>

  <rect x="170" y="380" width="470" height="110" rx="18" fill="#ffffff" stroke="#c4922a" stroke-width="3"/>
  <text x="405" y="428" text-anchor="middle" font-size="26" font-weight="bold" fill="#003865">Run the job</text>
  <text x="405" y="464" text-anchor="middle" font-size="20" fill="#4a5b6b">Hourly, nightly, or month-end</text>

  <polygon points="405,510 390,540 420,540" fill="#c4922a"/>
  <line x1="405" y1="490" x2="405" y2="530" stroke="#c4922a" stroke-width="6"/>

  <rect x="170" y="550" width="470" height="110" rx="18" fill="#ffffff" stroke="#c4922a" stroke-width="3"/>
  <text x="405" y="598" text-anchor="middle" font-size="26" font-weight="bold" fill="#003865">Deliver the result</text>
  <text x="405" y="634" text-anchor="middle" font-size="20" fill="#4a5b6b">Report, table, or warehouse load</text>

  <text x="406" y="740" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a5a00">Ready when the job finishes</text>
  <text x="406" y="782" text-anchor="middle" font-size="20" fill="#5c4a32">Strong when nobody is waiting on one record</text>

  <text x="1194" y="110" text-anchor="middle" font-size="36" font-weight="bold" fill="#0c6b52">Event stream</text>
  <text x="1194" y="158" text-anchor="middle" font-size="22" fill="#24584a">Each fact is published as it happens</text>

  <rect x="900" y="210" width="180" height="90" rx="16" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="990" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#003865">Alarm</text>
  <rect x="1100" y="210" width="180" height="90" rx="16" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1190" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#003865">Transfer</text>
  <rect x="1300" y="210" width="180" height="90" rx="16" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1390" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#003865">Order</text>

  <polygon points="1194,330 1179,360 1209,360" fill="#0e7c66"/>
  <line x1="1194" y1="300" x2="1194" y2="350" stroke="#0e7c66" stroke-width="6"/>

  <rect x="960" y="370" width="470" height="120" rx="18" fill="#003865"/>
  <text x="1195" y="422" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">Topic on Confluent Cloud</text>
  <text x="1195" y="460" text-anchor="middle" font-size="20" fill="#d6e6f2">Durable log, available immediately</text>

  <polygon points="1194,520 1179,550 1209,550" fill="#0e7c66"/>
  <line x1="1194" y1="490" x2="1194" y2="540" stroke="#0e7c66" stroke-width="6"/>

  <rect x="900" y="560" width="270" height="100" rx="16" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1035" y="618" text-anchor="middle" font-size="22" font-weight="bold" fill="#003865">Operational app</text>
  <rect x="1210" y="560" width="270" height="100" rx="16" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1345" y="618" text-anchor="middle" font-size="22" font-weight="bold" fill="#003865">Alert consumer</text>

  <text x="1194" y="740" text-anchor="middle" font-size="24" font-weight="bold" fill="#0c6b52">Usable while the fact is still true</text>
  <text x="1194" y="782" text-anchor="middle" font-size="20" fill="#24584a">Many consumers can react without polling the source</text>
</svg>
