<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="112%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e4eaf2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="36" width="552" height="212" rx="18" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <rect x="36" y="36" width="552" height="14" rx="7" fill="#1a73e8"/>
    <rect x="36" y="43" width="552" height="7" fill="#1a73e8"/>
    <circle cx="78" cy="92" r="22" fill="#e8f0fe"/>
    <text x="78" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">1</text>
    <text x="116" y="100" font-size="20" font-weight="700" fill="#1a2332">Agent</text>
    <text x="78" y="150" font-size="15" fill="#1a2332">- Worker unit (LlmAgent or workflow)</text>
    <text x="78" y="178" font-size="15" fill="#1a2332">- Goals, persona, and model choice</text>
    <text x="78" y="206" font-size="15" fill="#1a2332">- Instructions that drive tool use</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="612" y="36" width="552" height="212" rx="18" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <rect x="612" y="36" width="552" height="14" rx="7" fill="#34a853"/>
    <rect x="612" y="43" width="552" height="7" fill="#34a853"/>
    <circle cx="654" cy="92" r="22" fill="#e6f4ea"/>
    <text x="654" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#34a853">2</text>
    <text x="692" y="100" font-size="20" font-weight="700" fill="#1a2332">Tool</text>
    <text x="654" y="150" font-size="15" fill="#1a2332">- Callable capability (API, search, code)</text>
    <text x="654" y="178" font-size="15" fill="#1a2332">- Python functions the agent can invoke</text>
    <text x="654" y="206" font-size="15" fill="#1a2332">- Other agents can act as tools too</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="36" y="272" width="552" height="212" rx="18" fill="#ffffff" stroke="#f9ab00" stroke-width="2.5"/>
    <rect x="36" y="272" width="552" height="14" rx="7" fill="#f9ab00"/>
    <rect x="36" y="279" width="552" height="7" fill="#f9ab00"/>
    <circle cx="78" cy="328" r="22" fill="#fef7e0"/>
    <text x="78" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#e37400">3</text>
    <text x="116" y="336" font-size="20" font-weight="700" fill="#1a2332">Session / State</text>
    <text x="78" y="386" font-size="15" fill="#1a2332">- One conversation history and memory</text>
    <text x="78" y="414" font-size="15" fill="#1a2332">- Working values passed between steps</text>
    <text x="78" y="442" font-size="15" fill="#1a2332">- Shared across multi-agent handoffs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="612" y="272" width="552" height="212" rx="18" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <rect x="612" y="272" width="552" height="14" rx="7" fill="#ea4335"/>
    <rect x="612" y="279" width="552" height="7" fill="#ea4335"/>
    <circle cx="654" cy="328" r="22" fill="#fce8e6"/>
    <text x="654" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#ea4335">4</text>
    <text x="692" y="336" font-size="20" font-weight="700" fill="#1a2332">Runner and Event</text>
    <text x="654" y="386" font-size="15" fill="#1a2332">- Runner drives orchestration and loops</text>
    <text x="654" y="414" font-size="15" fill="#1a2332">- Event = atomic unit of what happened</text>
    <text x="654" y="442" font-size="15" fill="#1a2332">- User turn, tool call, model reply</text>
  </g>
</svg>
