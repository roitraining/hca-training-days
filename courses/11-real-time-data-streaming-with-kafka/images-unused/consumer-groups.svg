<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#f4f7fb"/>

  <rect x="40" y="36" width="700" height="828" rx="24" fill="#ffffff" stroke="#003865" stroke-width="3"/>
  <text x="390" y="100" text-anchor="middle" font-size="30" font-weight="bold" fill="#003865">One topic, three partitions</text>
  <text x="390" y="142" text-anchor="middle" font-size="20" fill="#4a5b6b">Order holds inside a partition, not across them</text>

  <text x="120" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d6fad">P0</text>
  <rect x="180" y="190" width="140" height="70" rx="12" fill="#d6e6f2" stroke="#1d6fad" stroke-width="2"/>
  <text x="250" y="232" text-anchor="middle" font-size="20" fill="#003865">e1</text>
  <rect x="340" y="190" width="140" height="70" rx="12" fill="#d6e6f2" stroke="#1d6fad" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" font-size="20" fill="#003865">e2</text>
  <rect x="500" y="190" width="140" height="70" rx="12" fill="#d6e6f2" stroke="#1d6fad" stroke-width="2"/>
  <text x="570" y="232" text-anchor="middle" font-size="20" fill="#003865">e3</text>

  <text x="120" y="420" text-anchor="middle" font-size="22" font-weight="bold" fill="#0e7c66">P1</text>
  <rect x="180" y="380" width="140" height="70" rx="12" fill="#d8f3ec" stroke="#0e7c66" stroke-width="2"/>
  <text x="250" y="422" text-anchor="middle" font-size="20" fill="#003865">e4</text>
  <rect x="340" y="380" width="140" height="70" rx="12" fill="#d8f3ec" stroke="#0e7c66" stroke-width="2"/>
  <text x="410" y="422" text-anchor="middle" font-size="20" fill="#003865">e5</text>

  <text x="120" y="610" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a5a00">P2</text>
  <rect x="180" y="570" width="140" height="70" rx="12" fill="#f8ecd4" stroke="#c4922a" stroke-width="2"/>
  <text x="250" y="612" text-anchor="middle" font-size="20" fill="#003865">e6</text>
  <rect x="340" y="570" width="140" height="70" rx="12" fill="#f8ecd4" stroke="#c4922a" stroke-width="2"/>
  <text x="410" y="612" text-anchor="middle" font-size="20" fill="#003865">e7</text>
  <rect x="500" y="570" width="140" height="70" rx="12" fill="#f8ecd4" stroke="#c4922a" stroke-width="2"/>
  <text x="570" y="612" text-anchor="middle" font-size="20" fill="#003865">e8</text>

  <text x="390" y="760" text-anchor="middle" font-size="20" fill="#4a5b6b">Same key always lands on the same partition</text>
  <text x="390" y="798" text-anchor="middle" font-size="20" fill="#4a5b6b">That is how one patient or device stays ordered</text>

  <rect x="780" y="36" width="780" height="390" rx="24" fill="#ffffff" stroke="#1d6fad" stroke-width="3"/>
  <text x="1170" y="100" text-anchor="middle" font-size="28" font-weight="bold" fill="#1d6fad">Group: bed-board</text>
  <text x="1170" y="142" text-anchor="middle" font-size="20" fill="#4a5b6b">One application, scaled out</text>
  <rect x="830" y="190" width="320" height="150" rx="16" fill="#e8f1f8"/>
  <text x="990" y="250" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Consumer A</text>
  <text x="990" y="290" text-anchor="middle" font-size="20" fill="#1d6fad">reads P0 and P1</text>
  <rect x="1180" y="190" width="320" height="150" rx="16" fill="#e8f1f8"/>
  <text x="1340" y="250" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Consumer B</text>
  <text x="1340" y="290" text-anchor="middle" font-size="20" fill="#1d6fad">reads P2</text>
  <text x="1170" y="390" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">Together they cover the topic once</text>

  <rect x="780" y="460" width="780" height="400" rx="24" fill="#ffffff" stroke="#0e7c66" stroke-width="3"/>
  <text x="1170" y="530" text-anchor="middle" font-size="28" font-weight="bold" fill="#0c6b52">Group: nutrition</text>
  <text x="1170" y="572" text-anchor="middle" font-size="20" fill="#4a5b6b">A second application, own offsets</text>
  <rect x="980" y="610" width="380" height="140" rx="16" fill="#eef8f5"/>
  <text x="1170" y="670" text-anchor="middle" font-size="24" font-weight="bold" fill="#003865">Consumer C</text>
  <text x="1170" y="710" text-anchor="middle" font-size="20" fill="#0e7c66">reads P0, P1, and P2</text>
  <text x="1170" y="810" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">This group receives every event</text>
</svg>
