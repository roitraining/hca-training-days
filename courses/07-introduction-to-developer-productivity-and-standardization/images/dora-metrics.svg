<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <!-- Deployment Frequency -->
  <g filter="url(#shadow)">
    <rect x="12" y="20" width="250" height="260" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="137" cy="100" r="42" fill="#ccfbf1"/>
    <rect x="118" y="82" width="38" height="36" rx="4" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <line x1="118" y1="92" x2="156" y2="92" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="126" cy="86" r="2.5" fill="#0d9488"/>
    <circle cx="148" cy="86" r="2.5" fill="#0d9488"/>
    <circle cx="148" cy="112" r="8" fill="#0d9488"/>
    <path d="M144,112 l3,3 l6,-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="137" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Deployment</text>
    <text x="137" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Frequency</text>
  </g>
  <line x1="270" y1="150" x2="298" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Lead Time -->
  <g filter="url(#shadow)">
    <rect x="306" y="20" width="250" height="260" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="431" cy="100" r="42" fill="#e8f0fe"/>
    <circle cx="431" cy="100" r="22" fill="none" stroke="#1a73e8" stroke-width="3"/>
    <line x1="431" y1="100" x2="431" y2="86" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <line x1="431" y1="100" x2="444" y2="108" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M452,92 h14 M458,86 v12" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="431" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Lead Time</text>
    <text x="431" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">for Changes</text>
  </g>
  <line x1="564" y1="150" x2="592" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Change Fail Rate -->
  <g filter="url(#shadow)">
    <rect x="600" y="20" width="250" height="260" rx="14" fill="#ffffff" stroke="#d93025" stroke-width="2.5"/>
    <circle cx="725" cy="100" r="42" fill="#fce8e6"/>
    <polyline points="702,118 712,100 722,108 738,82" fill="none" stroke="#d93025" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="742" cy="118" r="10" fill="#d93025"/>
    <path d="M737,113 l10,10 M747,113 l-10,10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="725" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Change</text>
    <text x="725" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Fail Rate</text>
  </g>
  <line x1="858" y1="150" x2="886" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Time to Restore -->
  <g filter="url(#shadow)">
    <rect x="894" y="20" width="274" height="260" rx="14" fill="#ffffff" stroke="#7b61ff" stroke-width="2.5"/>
    <circle cx="1031" cy="100" r="42" fill="#f0ebff"/>
    <circle cx="1031" cy="88" r="14" fill="none" stroke="#7b61ff" stroke-width="2.5"/>
    <line x1="1031" y1="82" x2="1031" y2="92" stroke="#7b61ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1031" cy="96" r="2" fill="#7b61ff"/>
    <line x1="1008" y1="116" x2="1054" y2="116" stroke="#7b61ff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1008,116 l6,-6 M1008,116 l6,6 M1054,116 l-6,-6 M1054,116 l-6,6" stroke="#7b61ff" stroke-width="2" stroke-linecap="round"/>
    <text x="1031" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Time to</text>
    <text x="1031" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2332">Restore</text>
  </g>
</svg>
