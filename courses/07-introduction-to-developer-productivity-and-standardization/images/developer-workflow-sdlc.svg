<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 340" width="1220" height="340" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <!-- Plan -->
  <g filter="url(#shadow)">
    <rect x="12" y="24" width="200" height="220" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="112" cy="96" r="36" fill="#ccfbf1"/>
    <circle cx="112" cy="96" r="22" fill="none" stroke="#0d9488" stroke-width="3"/>
    <circle cx="112" cy="96" r="4" fill="#0d9488"/>
    <line x1="112" y1="96" x2="112" y2="78" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <line x1="112" y1="96" x2="126" y2="104" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
    <text x="112" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">Plan</text>
  </g>
  <line x1="220" y1="134" x2="244" y2="134" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Code -->
  <g filter="url(#shadow)">
    <rect x="252" y="24" width="200" height="220" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="352" cy="96" r="36" fill="#e8f0fe"/>
    <rect x="332" y="82" width="40" height="28" rx="3" fill="none" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M340,92 h10 M340,100 h18" stroke="#1a73e8" stroke-width="2"/>
    <text x="352" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">&lt;/&gt;</text>
    <text x="352" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">Code</text>
  </g>
  <line x1="460" y1="134" x2="484" y2="134" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Review -->
  <g filter="url(#shadow)">
    <rect x="492" y="24" width="200" height="220" rx="14" fill="#ffffff" stroke="#4285f4" stroke-width="2.5"/>
    <circle cx="592" cy="96" r="36" fill="#e8f0fe"/>
    <path d="M578,108 L592,72 L606,108 Z" fill="none" stroke="#4285f4" stroke-width="2.5"/>
    <path d="M586,100 l4,4 l8,-10" fill="none" stroke="#4285f4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="592" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">Review</text>
  </g>
  <line x1="700" y1="134" x2="724" y2="134" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Build / Test -->
  <g filter="url(#shadow)">
    <rect x="732" y="24" width="200" height="220" rx="14" fill="#ffffff" stroke="#7b61ff" stroke-width="2.5"/>
    <circle cx="832" cy="96" r="36" fill="#f0ebff"/>
    <circle cx="832" cy="96" r="18" fill="none" stroke="#7b61ff" stroke-width="3"/>
    <path d="M824,96 l6,6 l12,-14" fill="none" stroke="#7b61ff" stroke-width="3" stroke-linecap="round"/>
    <text x="832" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">Build /</text>
    <text x="832" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">Test</text>
  </g>
  <line x1="940" y1="134" x2="964" y2="134" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Deploy / Operate -->
  <g filter="url(#shadow)">
    <rect x="972" y="24" width="236" height="220" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
    <circle cx="1090" cy="96" r="36" fill="#f3e8ff"/>
    <path d="M1074,110 L1090,72 L1106,110 Z" fill="none" stroke="#9333ea" stroke-width="2.5"/>
    <line x1="1090" y1="88" x2="1090" y2="118" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1082,104 h16" stroke="#9333ea" stroke-width="2"/>
    <text x="1090" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">Deploy /</text>
    <text x="1090" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2332">Operate</text>
  </g>

  <text x="610" y="308" text-anchor="middle" font-size="24" font-weight="600" fill="#4a5568">AI assists at each stage - consistency comes from shared prompts and standards</text>
</svg>
