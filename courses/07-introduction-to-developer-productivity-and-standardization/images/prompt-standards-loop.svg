<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 300" width="1220" height="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <!-- Context -->
  <g filter="url(#shadow)">
    <rect x="12" y="20" width="260" height="260" rx="14" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <circle cx="142" cy="100" r="40" fill="#e8f0fe"/>
    <rect x="126" y="84" width="32" height="36" rx="3" fill="none" stroke="#1a73e8" stroke-width="2.5"/>
    <text x="142" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73e8">&lt;/&gt;</text>
    <circle cx="118" cy="78" r="5" fill="none" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="166" cy="78" r="5" fill="none" stroke="#1a73e8" stroke-width="2"/>
    <circle cx="142" cy="130" r="5" fill="none" stroke="#1a73e8" stroke-width="2"/>
    <text x="142" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">Context</text>
    <text x="142" y="228" text-anchor="middle" font-size="16" fill="#4a5568">Stack, repo,</text>
    <text x="142" y="252" text-anchor="middle" font-size="16" fill="#4a5568">constraints</text>
  </g>
  <line x1="280" y1="150" x2="308" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Task -->
  <g filter="url(#shadow)">
    <rect x="316" y="20" width="260" height="260" rx="14" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <circle cx="446" cy="100" r="40" fill="#e6f4ea"/>
    <rect x="428" y="82" width="28" height="34" rx="2" fill="none" stroke="#34a853" stroke-width="2.5"/>
    <path d="M434,92 h16 M434,100 h12 M434,108 h10" stroke="#34a853" stroke-width="2"/>
    <path d="M458,108 l10,-16 l4,2 l-10,16 z" fill="#34a853"/>
    <text x="446" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">Task</text>
    <text x="446" y="228" text-anchor="middle" font-size="16" fill="#4a5568">Exact change</text>
    <text x="446" y="252" text-anchor="middle" font-size="16" fill="#4a5568">requested</text>
  </g>
  <line x1="584" y1="150" x2="612" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Standards -->
  <g filter="url(#shadow)">
    <rect x="620" y="20" width="260" height="260" rx="14" fill="#ffffff" stroke="#e37400" stroke-width="2.5"/>
    <circle cx="750" cy="100" r="40" fill="#fef7e0"/>
    <path d="M732,86 h12 M732,96 h12 M732,106 h12" stroke="#e37400" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M728,86 l4,4 l6,-8 M728,96 l4,4 l6,-8 M728,106 l4,4 l6,-8" fill="none" stroke="#e37400" stroke-width="2" stroke-linecap="round"/>
    <path d="M760,88 v24 M752,100 h16" stroke="#e37400" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="766" y="104" width="12" height="14" rx="2" fill="none" stroke="#e37400" stroke-width="2"/>
    <text x="750" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">Standards</text>
    <text x="750" y="228" text-anchor="middle" font-size="16" fill="#4a5568">Style, tests,</text>
    <text x="750" y="252" text-anchor="middle" font-size="16" fill="#4a5568">security</text>
  </g>
  <line x1="888" y1="150" x2="916" y2="150" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Verify -->
  <g filter="url(#shadow)">
    <rect x="924" y="20" width="284" height="260" rx="14" fill="#ffffff" stroke="#7b61ff" stroke-width="2.5"/>
    <circle cx="1066" cy="100" r="40" fill="#f0ebff"/>
    <rect x="1044" y="82" width="36" height="28" rx="3" fill="none" stroke="#7b61ff" stroke-width="2.5"/>
    <text x="1062" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#7b61ff">&lt;/&gt;</text>
    <circle cx="1084" cy="108" r="10" fill="none" stroke="#7b61ff" stroke-width="2.5"/>
    <line x1="1092" y1="116" x2="1100" y2="124" stroke="#7b61ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1066" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">Verify</text>
    <text x="1066" y="228" text-anchor="middle" font-size="16" fill="#4a5568">Diff, run,</text>
    <text x="1066" y="252" text-anchor="middle" font-size="16" fill="#4a5568">review</text>
  </g>
</svg>
