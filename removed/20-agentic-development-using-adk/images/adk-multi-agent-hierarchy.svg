<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2332" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e4eaf2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <line x1="600" y1="148" x2="600" y2="188" stroke="#6b7c8f" stroke-width="3"/>
  <line x1="220" y1="188" x2="980" y2="188" stroke="#6b7c8f" stroke-width="3"/>
  <line x1="220" y1="188" x2="220" y2="220" stroke="#6b7c8f" stroke-width="3"/>
  <line x1="600" y1="188" x2="600" y2="220" stroke="#6b7c8f" stroke-width="3"/>
  <line x1="980" y1="188" x2="980" y2="220" stroke="#6b7c8f" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="340" y="36" width="520" height="112" rx="18" fill="#1a73e8"/>
    <text x="600" y="82" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Root Coordinator Agent</text>
    <text x="600" y="116" text-anchor="middle" font-size="15" fill="#d2e3fc">Decomposes user intent and routes tasks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="220" width="344" height="264" rx="18" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <path d="M48,238 Q48,220 66,220 H374 Q392,220 392,238 V276 H48 Z" fill="#34a853"/>
    <text x="220" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Search and Research</text>
    <text x="220" y="320" text-anchor="middle" font-size="15" fill="#1a2332">- Specialized web and doc search</text>
    <text x="220" y="352" text-anchor="middle" font-size="15" fill="#1a2332">- RAG / retrieval tools</text>
    <text x="220" y="384" text-anchor="middle" font-size="15" fill="#1a2332">- Returns structured findings</text>
    <rect x="88" y="430" width="224" height="36" rx="10" fill="#e6f4ea"/>
    <text x="220" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#34a853">Research Specialist</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="428" y="220" width="344" height="264" rx="18" fill="#ffffff" stroke="#f9ab00" stroke-width="2.5"/>
    <path d="M428,238 Q428,220 446,220 H754 Q772,220 772,238 V276 H428 Z" fill="#f9ab00"/>
    <text x="600" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Code Generator</text>
    <text x="600" y="320" text-anchor="middle" font-size="15" fill="#1a2332">- Writes code and unit tests</text>
    <text x="600" y="352" text-anchor="middle" font-size="15" fill="#1a2332">- Runs terminal commands</text>
    <text x="600" y="384" text-anchor="middle" font-size="15" fill="#1a2332">- Edits workspace files</text>
    <rect x="468" y="430" width="224" height="36" rx="10" fill="#fef7e0"/>
    <text x="600" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#e37400">Coding Specialist</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="808" y="220" width="344" height="264" rx="18" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <path d="M808,238 Q808,220 826,220 H1134 Q1152,220 1152,238 V276 H808 Z" fill="#ea4335"/>
    <text x="980" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Reviewer and Eval</text>
    <text x="980" y="320" text-anchor="middle" font-size="15" fill="#1a2332">- Evaluates output quality</text>
    <text x="980" y="352" text-anchor="middle" font-size="15" fill="#1a2332">- Runs automated eval suites</text>
    <text x="980" y="384" text-anchor="middle" font-size="15" fill="#1a2332">- Verifies safety guardrails</text>
    <rect x="848" y="430" width="224" height="36" rx="10" fill="#fce8e6"/>
    <text x="980" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">Quality Gatekeeper</text>
  </g>
</svg>
