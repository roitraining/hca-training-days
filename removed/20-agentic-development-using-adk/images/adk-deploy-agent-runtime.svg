<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-8%" y="-6%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a2332" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e4eaf2"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7c8f"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <line x1="306" y1="240" x2="330" y2="240" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="594" y1="240" x2="618" y2="240" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="882" y1="240" x2="906" y2="240" stroke="#6b7c8f" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 1 Local -->
  <g filter="url(#shadow)">
    <rect x="36" y="48" width="264" height="424" rx="20" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
    <path d="M36,68 Q36,48 56,48 H280 Q300,48 300,68 V118 H36 Z" fill="#1a73e8"/>
    <text x="168" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1. Local Agent</text>
    <circle cx="168" cy="178" r="34" fill="#e8f0fe"/>
    <rect x="150" y="160" width="36" height="36" rx="5" fill="none" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="168" cy="174" r="5" fill="#1a73e8"/>
    <path d="M168,180 V188" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
    <text x="168" y="250" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Same root_agent</text>
    <text x="168" y="282" text-anchor="middle" font-size="14" fill="#5a6a7a">Develop and demo locally</text>
    <text x="168" y="306" text-anchor="middle" font-size="14" fill="#5a6a7a">adk web / CLI runners</text>
    <text x="168" y="330" text-anchor="middle" font-size="14" fill="#5a6a7a">Validate tools first</text>
    <rect x="66" y="400" width="204" height="40" rx="10" fill="#e8f0fe"/>
    <text x="168" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1a73e8">Laptop</text>
  </g>

  <!-- 2 Package -->
  <g filter="url(#shadow)">
    <rect x="324" y="48" width="264" height="424" rx="20" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
    <path d="M324,68 Q324,48 344,48 H568 Q588,48 588,68 V118 H324 Z" fill="#34a853"/>
    <text x="456" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2. Package</text>
    <circle cx="456" cy="178" r="34" fill="#e6f4ea"/>
    <rect x="438" y="162" width="36" height="28" rx="4" fill="#34a853"/>
    <path d="M444,162 V154 h24 v8" fill="none" stroke="#34a853" stroke-width="3"/>
    <text x="456" y="250" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Code + dependencies</text>
    <text x="456" y="282" text-anchor="middle" font-size="14" fill="#5a6a7a">Bundle agent source</text>
    <text x="456" y="306" text-anchor="middle" font-size="14" fill="#5a6a7a">Declare runtime deps</text>
    <text x="456" y="330" text-anchor="middle" font-size="14" fill="#5a6a7a">Keep contract stable</text>
    <rect x="354" y="400" width="204" height="40" rx="10" fill="#e6f4ea"/>
    <text x="456" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#34a853">Artifact</text>
  </g>

  <!-- 3 Agent Runtime -->
  <g filter="url(#shadow)">
    <rect x="612" y="48" width="264" height="424" rx="20" fill="#ffffff" stroke="#f9ab00" stroke-width="2.5"/>
    <path d="M612,68 Q612,48 632,48 H856 Q876,48 876,68 V118 H612 Z" fill="#f9ab00"/>
    <text x="744" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3. Agent Runtime</text>
    <circle cx="744" cy="178" r="34" fill="#fef7e0"/>
    <path d="M744,158 L764,168 V184 c0,12 -8,20 -20,24 c-12,-4 -20,-12 -20,-24 V168 Z" fill="#e37400"/>
    <text x="744" y="250" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Managed hosting</text>
    <text x="744" y="282" text-anchor="middle" font-size="14" fill="#5a6a7a">On Agent Platform</text>
    <text x="744" y="306" text-anchor="middle" font-size="14" fill="#5a6a7a">Scale and governance</text>
    <text x="744" y="330" text-anchor="middle" font-size="14" fill="#5a6a7a">CLI, console, or CI/CD</text>
    <rect x="642" y="400" width="204" height="40" rx="10" fill="#fef7e0"/>
    <text x="744" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#e37400">Host</text>
  </g>

  <!-- 4 Query -->
  <g filter="url(#shadow)">
    <rect x="900" y="48" width="264" height="424" rx="20" fill="#ffffff" stroke="#ea4335" stroke-width="2.5"/>
    <path d="M900,68 Q900,48 920,48 H1144 Q1164,48 1164,68 V118 H900 Z" fill="#ea4335"/>
    <text x="1032" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4. Query</text>
    <circle cx="1032" cy="178" r="34" fill="#fce8e6"/>
    <circle cx="1032" cy="178" r="14" fill="none" stroke="#ea4335" stroke-width="3"/>
    <path d="M1032,164 V178 L1042,188" fill="none" stroke="#ea4335" stroke-width="3" stroke-linecap="round"/>
    <text x="1032" y="250" text-anchor="middle" font-size="16" font-weight="600" fill="#1a2332">Serve and validate</text>
    <text x="1032" y="282" text-anchor="middle" font-size="14" fill="#5a6a7a">Resource ID / endpoint</text>
    <text x="1032" y="306" text-anchor="middle" font-size="14" fill="#5a6a7a">Query and stream APIs</text>
    <text x="1032" y="330" text-anchor="middle" font-size="14" fill="#5a6a7a">Smoke-test local prompts</text>
    <rect x="930" y="400" width="204" height="40" rx="10" fill="#fce8e6"/>
    <text x="1032" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#ea4335">Live</text>
  </g>
</svg>
